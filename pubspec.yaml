name: bulusalim_airbridge_init
description: Initializes the Airbridge SDK from a custom Android Application class, for FlutterFlow projects that cannot create native files.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  airbridge_flutter_sdk: ^4.12.0

flutter:
  plugin:
    platforms:
      android:
        package: com.bulusalim.airbridgeinit
        pluginClass: AirbridgeInitPlugin
